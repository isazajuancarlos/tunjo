[dependencies]
argon2 = "0.5"
ed25519-dalek = "3"
hkdf = "0.13"
rand_core = "0.10"
sha2 = "0.11"
subtle = "2"
unicode-normalization = "0.1"
zeroize = "1"

[dependencies.aes-gcm]
version = "0.11"
features = ["zeroize"]
optional = true

[dependencies.chacha20]
version = "0.10"
features = [
    "rng",
    "zeroize",
]

[dependencies.chacha20poly1305]
version = "0.11"
features = ["zeroize"]

[dependencies.cryptoki]
version = "0.12"
optional = true

[dependencies.curve25519-dalek]
version = "5"
features = ["digest"]

[dependencies.fips205]
version = "0.4.1"
features = [
    "slh_dsa_sha2_256s",
    "default-rng",
]
optional = true
default-features = false

[dependencies.getrandom]
version = "0.4"
features = ["std"]

[dependencies.ml-dsa]
version = "0.1.1"
features = ["zeroize"]

[dependencies.ml-kem]
version = "0.3"
features = ["zeroize"]

[dependencies.quipu-nucleo]
version = "0.1.2"
path = "crates/quipu-nucleo"

[dependencies.quipu-voprf]
version = "0.2.2"
path = "crates/quipu-voprf"

[dependencies.sha3]
version = "0.11"
optional = true
default-features = false

[dependencies.x25519-dalek]
version = "3"
features = ["static_secrets"]

[dev-dependencies]
ml-dsa = "0.1.1"
ml-kem = "0.3"
proptest = "1"
serde_json = "1"
wycheproof = "0.6"

[dev-dependencies.aes-gcm]
version = "0.11"
features = ["zeroize"]

