# cargo-deny — control de cadena de suministro (lección Atomic Arch, #143).
# guaca es una librería pública (AGPL) sobre Quipu. Exige que TODA dependencia
# venga de crates.io, prohíbe comodines de versión y controla licencias.

[advisories]
version = 2
# TRES avisos de `yanked` son PERMANENTES y ESPERADOS: `quipu`, `quipu-voprf` y
# `padme-frame`. Los yankeamos nosotros el 2026-08-10 (protocolo «solo local»),
# no describen ningún fallo, y van a salir en cada corrida para siempre.
#
# Se dejan en `warn` en vez de silenciarlos con `yanked = "allow"`, que apagaría
# también el aviso de un yank AJENO —que sí querríamos ver—. Se nombran aquí para
# que un cuarto nombre en esa lista salte a la vista: una alarma que suena
# siempre es la que nadie mira a la tercera (directiva 23), y la única defensa es
# saber exactamente cuáles son las tres que no significan nada.
#
# Nota: desde que el árbol está vendorizado, cargo NO consulta el índice para
# construir — pero cargo-deny sí lo hace por su cuenta, así que estos avisos
# siguen apareciendo. Son dos mecanismos distintos y conviene no confundirlos.

[licenses]
version = 2
# Allowlist ajustada al árbol real (directiva 23): una licencia nueva = rojo.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # guaca y quipu son AGPL (de casa; licencia comercial aparte).
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# **Este comentario decía «guaca solo depende de quipu (crates.io); ninguna dep
# git», y dejó de ser cierto el 2026-08-11**: ese día el protocolo «solo local»
# mudó quipu al espejo con un `[patch.crates-io]`, y con él guaca pasó a tener
# una dependencia git — sin que nadie tocara esta línea. `cargo deny check
# sources` llevaba ROJO en `main` desde entonces, con cuatro
# `source-not-allowed`.
#
# Se corrige aquí y no solo se añade la excepción, porque una afirmación falsa
# en el archivo que declara qué fuentes se aceptan es peor que la excepción que
# falta: la excepción se ve en rojo, la afirmación no se ve nunca.
unknown-registry = "deny"
unknown-git = "deny"
# quipu faltaba, y por eso `cargo deny check sources` llevaba ROJO en `main`
# —cuatro `source-not-allowed`: quipu, quipu-nucleo, quipu-voprf y padme-frame—.
#
# **La causa tiene fecha y es UNA sola**: el commit del 2026-08-14 «quipu sale
# del ESPEJO, no de crates.io» mudó la fuente de quipu en CINCO repositorios de
# una pasada —medico, informes, chasqui, guaca y tunjo— y no tocó `allow-git`
# en ninguno. **No fue** el protocolo «solo local» del 08-10 ni la mudanza de
# guaca del 08-11: esos dos declararon lo que movían. Fue el barrido que movió
# una fuente y dejó su puerta sin declarar — comprobado con `git log -S` sobre
# el `Cargo.lock` de los cinco, no deducido.
#
# Medido el 2026-08-16 comparando `Cargo.lock` contra `deny.toml` en los nueve
# repositorios que tienen los dos: fallaban esos cinco, y solo esos cinco.
#
# Es el MISMO espejo local, no una fuente nueva.
allow-git = ["file:///home/juan/espejos/quipu.git"]
